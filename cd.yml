
name: CD

on:
  push:
    tags: ['v*']          
  workflow_dispatch:     
    inputs:
      tag:
        description: 'Tag ja publicada no GHCR (ex.: v1.0.0)'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}  

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push com a versao
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --platform linux/amd64 \
            --build-arg APP_VERSION="$TAG" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  deploy:
    needs: release
    if: ${{ !failure() && !cancelled() }}   
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Render
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE:$TAG\"}"

  verify:
    needs: deploy
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          URL=${{ vars.APP_URL }}
          MSG='{"nome":"cd","text":"não entendi nada"}'
          for _ in $(seq 90); do   # ate 15 min (startup lento)
            if curl -fsS "$URL/" | grep -q "\"$TAG\"" &&
               curl -fsS -X POST "$URL/predictions" \
                 -H "Content-Type: application/json" -d "$MSG"; then
              echo "OK: $TAG no ar"; exit 0
            fi
            sleep 10
          done
          echo "Falhou: $TAG nao respondeu. Faca o rollback."; exit 1
